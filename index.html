<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cordillera Chocolate</title>
<meta name="description" content="Portafolio de ingredientes de chocolate Cordillera para repostería, heladería, pastelería, panadería y bebidas. Pedidos por WhatsApp con Sofía en Caucasia y toda la zona de Distrileco.">
<meta name="theme-color" content="#0e2a38">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192-2.png">
<link rel="apple-touch-icon" href="icon-192-2.png">
<meta property="og:title" content="Chocolate Cordillera · Pide con Sofía">
<meta property="og:description" content="Coberturas, cocoas, chips y toppings Cordillera. Pide por WhatsApp en Caucasia, Bajo Cauca, Córdoba, Nordeste, Urabá y Sucre.">
<meta property="og:image" content="torta.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0e2a38;--navy2:#143a4c;--gold:#c9a24e;--gold2:#e2c27f;--cacao:#4a2c1d;
  --bg:#f6f2ea;--card:#ffffff;--ink:#1d2327;--muted:#5d6a70;--line:#e5ddcf;--wa:#1faa59;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1d26;--card:#12303e;--ink:#eef2f3;--muted:#a9b9bf;--line:#24495a}}
:root[data-theme="dark"]{--bg:#0b1d26;--card:#12303e;--ink:#eef2f3;--muted:#a9b9bf;--line:#24495a}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;overflow-x:hidden}
img{max-width:100%;display:block}
h1,h2,h3,.osw{font-family:Oswald,Impact,sans-serif;letter-spacing:.02em;line-height:1.1}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* nav */
nav.top{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:rgba(14,42,56,.88);backdrop-filter:blur(10px);color:#fff}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand .c{width:34px;height:34px;border:4px solid var(--gold);border-right-color:transparent;border-radius:50%;transform:rotate(45deg)}
.brand b{font-family:Oswald;font-size:20px;letter-spacing:.12em}
.brand small{display:block;font-size:10px;letter-spacing:.2em;color:var(--gold2);margin-top:-3px}
nav.top .links{display:flex;gap:18px;font-size:14px}
nav.top .links a{text-decoration:none;opacity:.85}
nav.top .links a:hover{opacity:1;color:var(--gold2)}
.cartbtn{position:relative;background:var(--gold);color:var(--navy);border:0;border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:14px}
.cartbtn i{font-style:normal;background:var(--navy);color:#fff;border-radius:999px;padding:1px 7px;margin-left:6px;font-size:12px}
@media(max-width:820px){nav.top .links{display:none}}

/* hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;color:#fff;overflow:hidden;background:var(--navy)}
.hero .slides img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.4s;animation:kb 18s ease-in-out infinite alternate}
.hero .slides img.on{opacity:1}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.14) translate(-2%,-1%)}}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,42,56,.35) 0%,rgba(14,42,56,.2) 40%,rgba(10,26,34,.92) 100%)}
.hero .in{position:relative;z-index:2;padding:120px 16px 56px;max-width:1180px;margin:0 auto;width:100%}
.eyebrow{display:inline-block;color:var(--gold2);font-size:12px;letter-spacing:.28em;text-transform:uppercase;font-weight:600;margin-bottom:12px}
.hero h1{font-size:clamp(40px,8vw,88px);font-weight:700;text-transform:uppercase}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p.lead{max-width:600px;font-size:clamp(16px,2.2vw,19px);opacity:.92;margin:16px 0 26px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:14px 24px;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;font-family:Inter}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.4)}
.btn.wa{background:var(--wa);color:#fff}
.uses{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.uses span{border:1px solid rgba(226,194,127,.5);color:var(--gold2);border-radius:999px;padding:5px 12px;font-size:13px}

/* stats */
.stats{background:var(--navy);color:#fff}
.stats .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,.08)}
.stats div{background:var(--navy);padding:26px 14px;text-align:center}
.stats b{display:block;font-family:Oswald;font-size:clamp(26px,4vw,40px);color:var(--gold)}
.stats span{font-size:13px;opacity:.8}
@media(max-width:640px){.stats .wrap{grid-template-columns:repeat(2,1fr)}}

section{padding:72px 0}
.sh{margin-bottom:28px}
.sh h2{font-size:clamp(30px,5vw,48px);text-transform:uppercase;color:var(--ink)}
.sh h2 em{font-style:normal;color:var(--gold)}
.sh p{color:var(--muted);max-width:640px;margin-top:8px}

/* line selector (Toyota-like) */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:22px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:14px}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.linehead{display:grid;grid-template-columns:1.1fr 1fr;gap:0;border-radius:18px;overflow:hidden;background:var(--navy);color:#fff;margin-bottom:22px;min-height:240px}
.linehead img{width:100%;height:100%;object-fit:cover;min-height:220px}
.linehead .t{padding:28px}
.linehead h3{font-size:clamp(26px,4vw,38px);text-transform:uppercase}
.linehead h3 em{font-style:normal;color:var(--gold)}
.linehead p{opacity:.88;margin-top:10px}
@media(max-width:720px){.linehead{grid-template-columns:1fr}.linehead img{max-height:220px}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(14,42,56,.14)}
.card .ph{background:#fff;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;padding:14px}
.card .ph img{max-height:100%;object-fit:contain}
.card .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.tag{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);}
.card h4{font-family:Oswald;font-size:19px;font-weight:600;text-transform:uppercase;line-height:1.15}
.card p{font-size:13.5px;color:var(--muted)}
.card .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:8px;font-size:13px;color:var(--muted)}
.card .ft b{color:var(--navy);background:var(--gold2);border-radius:999px;padding:5px 12px;font-size:12.5px}
:root[data-theme="dark"] .card .ft b{color:var(--navy)}

/* why */
.why{background:var(--navy);color:#fff}
.why .sh h2{color:#fff}
.why .sh p{color:#c5d3d8}
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.wgrid figure{position:relative;border-radius:16px;overflow:hidden;min-height:300px}
.wgrid figure img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wgrid figcaption{position:absolute;inset:auto 0 0 0;padding:18px;background:linear-gradient(transparent,rgba(8,22,30,.92))}
.wgrid figcaption b{display:block;font-family:Oswald;font-size:22px;text-transform:uppercase;color:var(--gold2)}
.wgrid figcaption span{font-size:14px;opacity:.9}
@media(max-width:820px){.wgrid{grid-template-columns:1fr}}

/* videos / reel */
.reel{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.vid{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:9/14;background:#000}
.vid video,.vid iframe{width:100%;height:100%;object-fit:cover;border:0}
.vid .story img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s}
.vid .story img.on{opacity:1;animation:kb 7s linear forwards}
.vid .cap{position:absolute;inset:auto 0 0 0;padding:16px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.8));z-index:2}
.vid .cap b{font-family:Oswald;font-size:20px;text-transform:uppercase}
.vid .bar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:4px;z-index:3}
.vid .bar i{flex:1;height:3px;background:rgba(255,255,255,.35);border-radius:3px;overflow:hidden}
.vid .bar i u{display:block;height:100%;width:0;background:#fff}

/* seller */
.seller{display:grid;grid-template-columns:1fr 1.2fr;gap:28px;align-items:center}
.seller .pic{border-radius:18px;overflow:hidden;aspect-ratio:4/5}
.seller .pic img{width:100%;height:100%;object-fit:cover}
.zones{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.zones span{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.zones span b{color:var(--gold)}
.steps{counter-reset:s;display:grid;gap:12px;margin:18px 0 24px}
.steps li{list-style:none;display:flex;gap:12px;align-items:flex-start}
.steps li:before{counter-increment:s;content:counter(s);flex:0 0 32px;height:32px;border-radius:50%;background:var(--gold);color:var(--navy);font-weight:800;display:flex;align-items:center;justify-content:center}
@media(max-width:820px){.seller{grid-template-columns:1fr}.seller .pic{aspect-ratio:16/10}}

footer{background:#081a23;color:#b9c8ce;padding:36px 0 110px;font-size:13.5px}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between}
footer b{color:#fff}

/* modal */
.ov{position:fixed;inset:0;background:rgba(5,16,22,.6);z-index:80;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:760px;max-height:92svh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 18px 26px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(min-width:760px){.ov{align-items:center}.sheet{border-radius:22px}}
.sheet .x{float:right;border:0;background:var(--bg);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer}
.pd{display:grid;grid-template-columns:220px 1fr;gap:20px;clear:both}
.pd .im{background:#fff;border-radius:14px;padding:12px;display:flex;align-items:center;justify-content:center}
.pd h3{font-size:28px;text-transform:uppercase;margin:4px 0 8px}
.pd ul.b{margin:10px 0 0 18px;font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{font-size:12px;background:var(--bg);border-radius:999px;padding:4px 10px}
@media(max-width:600px){.pd{grid-template-columns:1fr}.pd .im{max-height:240px}.pd .im img{max-height:210px}}
.pres{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.pres h5{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.prow small{display:block;color:var(--muted);font-size:12px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer}
.qty b{min-width:22px;text-align:center}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600}
.field input,.field select,.field textarea{font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}

.fab{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;gap:10px;align-items:center}
.fab a{width:58px;height:58px;border-radius:50%;background:var(--wa);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.fab a svg{width:30px;height:30px;fill:#fff}
.reftag{position:fixed;left:16px;bottom:22px;z-index:60;background:var(--navy);color:var(--gold2);font-size:12px;border-radius:999px;padding:7px 12px;border:1px solid rgba(226,194,127,.4)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;z-index:90;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>

<nav class="top">
  <a class="brand" href="#inicio"><span class="c"></span><span><b>CORDILLERA</b><small>DESDE 1920</small></span></a>
  <div class="links"><a href="#lineas">Productos</a><a href="#videos">Videos</a><a href="#origen">Origen</a><a href="#pedir">Cómo pedir</a></div>
  <button class="cartbtn" onclick="openCart()">Mi pedido<i id="cc">0</i></button>
</nav>

<header class="hero" id="inicio">
  <div class="slides" id="slides">
    <img class="on" src="torta.jpg" alt="Torta bañada en chocolate Cordillera">
